aid: houseeazy
name: HouseEazy
description: 'HouseEazy is an Indian proptech startup, founded in 2021 by Tarun Sainani
  and Deepak Bhatia, that runs a full-stack platform for buying and selling ready-to-move,
  pre-owned residential homes across the Delhi NCR region (Noida, Ghaziabad, and Gurugram).
  It uses an AI/ML-based pricing algorithm built on over two million on-ground data
  points — registry records, market trends, and recent transactions — to price properties
  instantly, then pairs that with 3D walkthroughs, drone imagery, and virtual staging
  to make resale transactions fast, transparent, and secure. HouseEazy also offers
  LoanEazy home financing and a channel-partner program, and is backed by Accel, Antler,
  and DTU-IIF. It is a consumer-facing web application and publishes no public developer
  API, SDK, or documentation portal.'
